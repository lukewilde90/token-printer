<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTG Token Printer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#0d0a08; --panel:#1a1411; --panel2:#251c16;
    --gold:#d4af37; --gold-hi:#f4dc8a; --gold-lo:#8a6d1f;
    --parch:#ece0c6; --mut:#a8987a; --bad:#ff7b6e; --ok:#86e09a;
  }
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; min-height:100vh; color:var(--parch);
    font-family:'Crimson Pro', Georgia, serif; font-size:17px;
    background:
      radial-gradient(1100px 560px at 50% -12%, #43301f 0%, transparent 62%),
      radial-gradient(800px 500px at 105% 105%, #1c2b3d 0%, transparent 55%),
      repeating-linear-gradient(45deg, rgba(255,255,255,.015) 0 2px, transparent 2px 7px),
      var(--ink);
    padding:22px 16px 48px;
  }
  main { max-width:1000px; margin:0 auto; display:grid; gap:24px; grid-template-columns:1fr; }
  @media (min-width: 820px) {
    main { grid-template-columns: 1.1fr .9fr; align-items:start; }
    header { grid-column:1 / -1; }
    .sticky { position:sticky; top:18px; }
  }

  header { text-align:center; padding:6px 0 2px; }
  .mana { display:flex; justify-content:center; gap:9px; margin-bottom:12px; }
  .pip { width:22px; height:22px; border-radius:50%;
         box-shadow: inset 0 -3px 4px rgba(0,0,0,.35), 0 0 0 2px rgba(0,0,0,.55), 0 2px 7px rgba(0,0,0,.7); }
  .pip.w { background:radial-gradient(circle at 35% 30%, #fff, #f3ecc3 60%, #cfc597); }
  .pip.u { background:radial-gradient(circle at 35% 30%, #d9f1ff, #7fc4ee 60%, #3f8cc0); }
  .pip.b { background:radial-gradient(circle at 35% 30%, #8d827d, #3b3330 60%, #1a1513); }
  .pip.r { background:radial-gradient(circle at 35% 30%, #ffd3c1, #f2805e 60%, #c04a2c); }
  .pip.g { background:radial-gradient(circle at 35% 30%, #d5f0db, #6fbf88 60%, #2f7d4d); }
  h1 {
    font-family:Cinzel, Georgia, serif; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    margin:0; font-size:clamp(1.55rem, 5.2vw, 2.4rem);
    background:linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.65));
  }
  .tag { color:var(--mut); font-style:italic; margin-top:6px; }

  .panel {
    position:relative; border-radius:14px; padding:22px;
    background:linear-gradient(180deg, var(--panel2), var(--panel));
    border:1px solid var(--gold-lo);
    box-shadow: 0 0 0 3px #0b0807, 0 0 0 4px var(--gold-lo), 0 18px 40px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
  }
  .panel h2 {
    font-family:Cinzel, serif; font-size:.95rem; letter-spacing:.15em; text-transform:uppercase;
    color:var(--gold); margin:0; display:flex; align-items:center; gap:12px;
  }
  .panel h2::after { content:""; flex:1; height:1px; background:linear-gradient(90deg, var(--gold-lo), transparent); }
  .panel h2:not(:first-child) { margin-top:26px; }

  label {
    display:block; font-family:Cinzel, serif; font-size:.68rem; letter-spacing:.13em; text-transform:uppercase;
    color:var(--mut); margin:14px 0 5px;
  }
  input, textarea, select {
    width:100%; padding:10px 12px; border-radius:8px; border:1px solid #4d3b28;
    background:rgba(10,7,5,.7); color:var(--parch); font:inherit; font-size:1.02rem; outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  input:focus, textarea:focus, select:focus { border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.25); }
  textarea { min-height:92px; resize:vertical; }
  select {
    appearance:none; -webkit-appearance:none; padding-right:34px;
    background-image:linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
    background-position:calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size:5px 5px; background-repeat:no-repeat;
  }
  input[type=range] { padding:0; border:0; background:transparent; height:30px; accent-color:var(--gold); box-shadow:none; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; min-width:0; }

  button {
    font-family:Cinzel, serif; letter-spacing:.09em; text-transform:uppercase; font-weight:700; font-size:.82rem;
    padding:12px 16px; border-radius:10px; border:1px solid var(--gold-lo); cursor:pointer;
    background:linear-gradient(180deg, #f6e08f, #d4af37 55%, #a67c1c); color:#2a1a05;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 4px 10px rgba(0,0,0,.45);
    transition:transform .1s, filter .15s;
  }
  button:hover:not(:disabled) { filter:brightness(1.09); }
  button:active:not(:disabled) { transform:translateY(1px); }
  button.sec {
    background:linear-gradient(180deg, #2f241a, #1a1410); color:var(--gold-hi);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 4px 10px rgba(0,0,0,.45);
  }
  button:disabled { opacity:.45; cursor:not-allowed; }

  #results { display:grid; gap:6px; margin-top:10px; max-height:230px; overflow:auto; padding-right:4px; }
  #results button {
    text-align:left; text-transform:none; letter-spacing:0; font-family:'Crimson Pro', serif; font-weight:600; font-size:.98rem;
    padding:9px 12px; background:rgba(10,7,5,.6); color:var(--parch); border:1px solid #3c2d1d; box-shadow:none;
  }
  #results button:hover { border-color:var(--gold); color:var(--gold-hi); filter:none; }

  #results button { display:block; width:100%; }
  .r-top { display:flex; justify-content:space-between; align-items:baseline; gap:10px; }
  .r-name { font-family:Cinzel, serif; font-size:.9rem; letter-spacing:.03em; color:var(--gold-hi); }
  .r-set { font-family:Cinzel, serif; font-size:.62rem; letter-spacing:.1em; color:var(--mut); flex:none; }
  .r-text { margin-top:3px; font-size:.92rem; line-height:1.3; font-weight:400; color:var(--parch); }
  .r-text.none { color:var(--mut); font-style:italic; }

  .chk { display:flex; align-items:center; gap:10px; margin-top:16px; }
  .chk input { width:18px; height:18px; padding:0; accent-color:var(--gold); }
  .chk label { margin:0; font-family:'Crimson Pro', serif; text-transform:none; letter-spacing:0; font-size:1rem; color:var(--parch); }

  .stage {
    padding:20px 16px; border-radius:12px; border:1px solid #3c2d1d;
    background:radial-gradient(circle at 50% 28%, #3d2c1c, #120d0a 78%);
    box-shadow:inset 0 0 34px rgba(0,0,0,.75);
  }
  #preview { width:100%; max-width:330px; background:#fff; border-radius:10px; display:block; margin:0 auto;
             box-shadow:0 14px 34px rgba(0,0,0,.75), 0 0 0 1px #000; }
  .actions { display:flex; gap:10px; margin-top:16px; }
  .actions > * { flex:1; }
  #status { margin-top:14px; font-style:italic; color:var(--mut); min-height:1.3em; text-align:center; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--bad); }
  small { color:var(--mut); }
</style>
</head>
<body>
<main>
  <header>
    <div class="mana">
      <span class="pip w"></span><span class="pip u"></span><span class="pip b"></span><span class="pip r"></span><span class="pip g"></span>
    </div>
    <h1>MTG Token Printer v1.0</h1>
    <div class="tag">Summon a token, then print it on the spot.</div>
  </header>

  <section class="panel">
    <h2>Find a token</h2>
    <label for="search">Search Scryfall</label>
    <div class="row">
      <input id="search" placeholder="e.g. Goblin, Treasure, Soldier">
      <button class="sec" id="searchBtn" style="flex:0 0 auto">Search</button>
    </div>
    <div id="results"></div>

    <h2>Token details</h2>
    <label for="name">Name</label>
    <input id="name" value="Goblin">
    <label for="type">Type line</label>
    <input id="type" value="Token Creature — Goblin">
    <label for="pt">Power / Toughness</label>
    <input id="pt" value="1/1">
    <label for="rules">Rules text</label>
    <textarea id="rules"></textarea>

    <div class="chk"><input type="checkbox" id="useArt"><label for="useArt">Use Scryfall artwork</label></div>
    <label for="artMode">Artwork style</label>
    <select id="artMode">
      <option value="full">Full card image (real-card look)</option>
      <option value="crop">Artwork only, inside my layout</option>
    </select>

    <h2>Print settings</h2>
    <div class="row">
      <div><label for="copies">Copies</label><input id="copies" type="number" min="1" max="20" value="1"></div>
      <div>
        <label for="width">Paper width</label>
        <select id="width">
          <option value="384">58 mm</option>
          <option value="576">80 mm</option>
        </select>
      </div>
    </div>
    <label for="darkness">Darkness: <span id="darkVal">90</span></label>
    <input id="darkness" type="range" min="1" max="100" value="90">

    <div hidden>
      <select id="xfer">
        <option value="bal">Balanced – 100-byte packets</option>
        <option value="fast">Fast – 180-byte packets</option>
        <option value="safe">Safer – 60-byte packets</option>
        <option value="slow">Slow – 20-byte packets</option>
      </select>
    </div>
  </section>

  <section class="panel sticky">
    <h2>Preview</h2>
    <div class="stage" style="margin-top:14px"><canvas id="preview"></canvas></div>
    <div class="actions">
      <button id="connectBtn" class="sec">Connect printer</button>
      <button id="printBtn" disabled>Print</button>
    </div>
    <div id="status"></div>
    <details hidden>
      <summary>Debug log</summary>
      <pre id="log"></pre>
      <button class="sec" id="copyLog">Copy log</button>
    </details>
  </section>
</main>

<script>
(function () {
const $ = id => document.getElementById(id);
window.addEventListener('error', e => {
  const s = document.getElementById('status');
  if (s) { s.textContent = 'Error: ' + e.message; s.className = 'err'; }
});
const canvas = $('preview');
let artImg = null, fullImg = null;
let device = null, characteristic = null, mxw = null;
$('darkness').addEventListener('input', () => { $('darkVal').textContent = $('darkness').value; });

// ---------- Scryfall lookup ----------
$('searchBtn').onclick = search;
$('search').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });

async function search() {
  const q = $('search').value.trim();
  if (!q) return;
  const box = $('results');
  box.innerHTML = '<small>Searching…</small>';
  try {
    const url = 'https://api.scryfall.com/cards/search?unique=cards&q=' +
      encodeURIComponent(`t:token name:"${q}"`);
    const r = await fetch(url);
    if (!r.ok) throw new Error('No tokens found');
    const data = await r.json();
    box.innerHTML = '';
    data.data.slice(0, 30).forEach(c => {
      const face = c.card_faces && !c.image_uris ? c.card_faces[0] : c;
      const b = document.createElement('button');
      const p = face.power != null ? face.power : c.power;
      const t = face.toughness != null ? face.toughness : c.toughness;
      const pt = p != null ? ` ${p}/${t}` : '';
      const ty = face.type_line || c.type_line || '';
      let abil = (face.oracle_text || c.oracle_text || '').replace(/\s*\n\s*/g, ' · ');
      if (!/Creature/.test(ty)) {   // e.g. Treasure, Clue: show what kind of token it is
        abil = ty.replace(/^Token\s+/, '') + (abil ? ' — ' + abil : '');
      }
      if (abil.length > 110) abil = abil.slice(0, 107) + '…';
      const top = document.createElement('div'); top.className = 'r-top';
      const nm = document.createElement('span'); nm.className = 'r-name';
      nm.textContent = c.name.split(' // ')[0] + pt;
      const st = document.createElement('span'); st.className = 'r-set';
      st.textContent = c.set ? c.set.toUpperCase() : '';
      top.append(nm, st);
      const sub = document.createElement('div');
      sub.className = 'r-text' + (abil ? '' : ' none');
      sub.textContent = abil || 'No abilities';
      b.append(top, sub);
      b.onclick = () => pick(c, face);
      box.appendChild(b);
    });
  } catch (e) {
    box.innerHTML = `<small>${e.message}</small>`;
  }
}

function pick(c, face) {
  $('name').value = c.name.split(' // ')[0];
  $('type').value = (face.type_line || c.type_line || '');
  const p = face.power != null ? face.power : c.power;
  const t = face.toughness != null ? face.toughness : c.toughness;
  $('pt').value = p != null ? `${p}/${t}` : '';
  $('rules').value = face.oracle_text || c.oracle_text || '';
  artImg = null; fullImg = null;
  $('useArt').checked = true; $('artMode').value = 'full';
  const uris = face.image_uris || c.image_uris || {};
  const load = (src, assign) => {
    if (!src) return;
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { assign(img); render(); };
    img.onerror = () => { assign(null); render(); };
    img.src = src;
  };
  load(uris.art_crop, img => { artImg = img; });
  load(uris.border_crop || uris.normal, img => { fullImg = img; });
  render();
}

// ---------- Rendering ----------
function wrap(ctx, text, maxW) {
  const lines = [];
  for (const para of text.split('\n')) {
    let line = '';
    for (const word of para.split(/\s+/)) {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = word; }
      else line = test;
    }
    lines.push(line);
  }
  return lines;
}

function render() {
  const W = parseInt($('width').value, 10);
  const H = Math.round(W * 1.4);
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);

  // Full Scryfall card image (with borders), converted to high-contrast greyscale
  if ($('useArt').checked && $('artMode').value === 'full' && fullImg) {
    const r = Math.max(W / fullImg.width, H / fullImg.height);
    const dw = fullImg.width * r, dh = fullImg.height * r;
    // Black rounded "card border" first, then the card image inset inside it,
    // so the rounded corners stay visible even when the card's own edge is light.
    const R = Math.round(W * 0.055);          // real-card corner radius (~3.5 mm on 63 mm)
    const b = Math.max(3, Math.round(W * 0.014));
    ctx.fillStyle = '#000';
    roundRect(ctx, 0, 0, W, H, R); ctx.fill();
    ctx.save();
    roundRect(ctx, b, b, W - 2 * b, H - 2 * b, Math.max(2, R - b));
    ctx.clip();
    const r2 = Math.max((W - 2 * b) / fullImg.width, (H - 2 * b) / fullImg.height);
    const dw2 = fullImg.width * r2, dh2 = fullImg.height * r2;
    ctx.drawImage(fullImg, (W - dw2) / 2, (H - dh2) / 2, dw2, dh2);
    ctx.restore();
    try {
      const im = ctx.getImageData(0, 0, W, H), px = im.data;
      for (let i = 0; i < px.length; i += 4) {
        const g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
        const v = Math.max(0, Math.min(255, (g - 128) * 1.35 + 128 + 8));
        px[i] = px[i + 1] = px[i + 2] = v;
      }
      ctx.putImageData(im, 0, 0);
    } catch (e) { /* tainted canvas: leave colour, dithering will still greyscale it */ }
    return;
  }
  ctx.fillStyle = '#000'; ctx.strokeStyle = '#000';

  const m = Math.max(2, Math.round(W * 0.008));   // keep my own layout close to the paper edge
  const u = W / 384;                 // scale unit
  ctx.lineWidth = 4 * u;
  roundRect(ctx, m, m, W - 2 * m, H - 2 * m, 18 * u); ctx.stroke();
  const pad = m + 12 * u;
  const inner = W - 2 * pad;
  let y = pad;

  // Name
  ctx.textBaseline = 'top';
  let fs = 30 * u;
  const name = $('name').value || '';
  do { ctx.font = `bold ${fs}px Georgia, serif`; fs -= 1; } while (ctx.measureText(name).width > inner && fs > 12);
  ctx.fillText(name, pad, y);
  y += fs * 1.5;
  ctx.lineWidth = 2 * u;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  y += 8 * u;

  // Art
  const artH = Math.round(H * 0.30);
  if ($('useArt').checked && artImg) {
    const r = Math.max(inner / artImg.width, artH / artImg.height);
    const sw = inner / r, sh = artH / r;
    ctx.save();
    ctx.beginPath(); ctx.rect(pad, y, inner, artH); ctx.clip();
    ctx.filter = 'grayscale(1) contrast(1.25) brightness(1.05)';
    ctx.drawImage(artImg, (artImg.width - sw) / 2, (artImg.height - sh) / 2, sw, sh, pad, y, inner, artH);
    ctx.restore();
    ctx.lineWidth = 2 * u; ctx.strokeRect(pad, y, inner, artH);
    y += artH + 8 * u;
  }

  // Type line
  fs = 20 * u;
  const type = $('type').value || '';
  do { ctx.font = `bold ${fs}px Georgia, serif`; fs -= 1; } while (ctx.measureText(type).width > inner && fs > 10);
  ctx.fillText(type, pad, y);
  y += fs * 1.5;
  ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  y += 8 * u;

  // P/T box reserve
  const pt = $('pt').value.trim();
  const ptH = pt ? 50 * u : 0;
  const bottom = H - m - 10 * u - ptH;

  // Rules text (shrink to fit)
  const rules = $('rules').value;
  fs = 24 * u;
  let lines;
  while (true) {
    ctx.font = `${fs}px Georgia, serif`;
    lines = wrap(ctx, rules, inner);
    if (y + lines.length * fs * 1.25 <= bottom || fs <= 11) break;
    fs -= 1;
  }
  lines.forEach((l, i) => ctx.fillText(l, pad, y + i * fs * 1.25));

  // P/T
  if (pt) {
    ctx.font = `bold ${34 * u}px Georgia, serif`;
    const tw = ctx.measureText(pt).width;
    const bw = tw + 28 * u, bh = 46 * u;
    const bx = W - pad - bw, by = H - m - 10 * u - bh;
    ctx.fillStyle = '#fff'; ctx.lineWidth = 3 * u;
    roundRect(ctx, bx, by, bw, bh, 10 * u); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(pt, bx + bw / 2, by + bh / 2 + 2 * u);
    ctx.textAlign = 'left';
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

['name', 'type', 'pt', 'rules', 'useArt', 'artMode', 'width'].forEach(id => $(id).addEventListener('input', render));
render();

// ---------- Bitmap conversion (Floyd–Steinberg dither) ----------
function toBitmap(lsbFirst = false) {
  const ctx = canvas.getContext('2d');
  const { width: W, height: H } = canvas;
  const img = ctx.getImageData(0, 0, W, H).data;
  const g = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) g[i] = 0.299 * img[i*4] + 0.587 * img[i*4+1] + 0.114 * img[i*4+2];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x, old = g[i], nw = old < 128 ? 0 : 255, err = old - nw;
    g[i] = nw;
    if (x + 1 < W) g[i + 1] += err * 7 / 16;
    if (y + 1 < H) {
      if (x > 0) g[i + W - 1] += err * 3 / 16;
      g[i + W] += err * 5 / 16;
      if (x + 1 < W) g[i + W + 1] += err * 1 / 16;
    }
  }
  const bpr = W / 8;
  const out = new Uint8Array(bpr * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++)
    if (g[y * W + x] < 128) out[y * bpr + (x >> 3)] |= lsbFirst ? (1 << (x & 7)) : (0x80 >> (x & 7));
  return { data: out, bpr, H };
}

function buildEscPos(bmp) {
  const parts = [new Uint8Array([0x1B, 0x40])];      // init
  const band = 64;
  for (let y = 0; y < bmp.H; y += band) {
    const h = Math.min(band, bmp.H - y);
    parts.push(new Uint8Array([0x1D, 0x76, 0x30, 0x00,
      bmp.bpr & 255, bmp.bpr >> 8, h & 255, h >> 8]));
    parts.push(bmp.data.subarray(y * bmp.bpr, (y + h) * bmp.bpr));
  }
  parts.push(new Uint8Array([0x1B, 0x64, 0x04]));    // feed 4 lines
  const len = parts.reduce((a, p) => a + p.length, 0);
  const all = new Uint8Array(len);
  let o = 0; parts.forEach(p => { all.set(p, o); o += p.length; });
  return all;
}

// ---------- Bluetooth ----------
const status = (msg, cls = '') => { $('status').textContent = msg; $('status').className = cls; };

const OPTIONAL_SERVICES = [
  '000018f0-0000-1000-8000-00805f9b34fb',
  '0000ffe0-0000-1000-8000-00805f9b34fb',
  '0000ff00-0000-1000-8000-00805f9b34fb',
  '0000fee7-0000-1000-8000-00805f9b34fb',
  '0000ae30-0000-1000-8000-00805f9b34fb',
  '49535343-fe7d-4ae5-8fa9-9fafd205e455',
  'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
  '0000ffe5-0000-1000-8000-00805f9b34fb',
];

$('connectBtn').onclick = connect;
$('printBtn').onclick = print;

async function connect() {
  if (!navigator.bluetooth) {
    status(btHint(), 'err');
    return;
  }
  try {
    status('Choose your printer…');
    device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: OPTIONAL_SERVICES });
    device.addEventListener('gattserverdisconnected', () => {
      characteristic = null; $('printBtn').disabled = true; $('connectBtn').textContent = 'Connect printer';
      status('Printer disconnected.');
    });
    status('Connecting…');
    const server = await device.gatt.connect();
    characteristic = null; mxw = null;
    // MXW01 / C17 "cat printer" family: service AE30 with AE01 (commands), AE02 (notify), AE03 (data)
    try {
      const svc = await server.getPrimaryService(UUID('ae30'));
      const ctl = await svc.getCharacteristic(UUID('ae01'));
      const ntf = await svc.getCharacteristic(UUID('ae02'));
      const dat = await svc.getCharacteristic(UUID('ae03'));
      await ntf.startNotifications();
      ntf.addEventListener('characteristicvaluechanged', onNotify);
      try {   // some models report completion on AE04
        const ntf2 = await svc.getCharacteristic(UUID('ae04'));
        await ntf2.startNotifications();
        ntf2.addEventListener('characteristicvaluechanged', onNotify);
      } catch (e) { /* optional */ }
      mxw = { ctl, ntf, dat };
      log('AE01 props: ' + propStr(ctl.properties) + ' | AE02: ' + propStr(ntf.properties) + ' | AE03: ' + propStr(dat.properties));
      characteristic = ctl;
      $('width').value = '384'; $('width').disabled = true; render();
    } catch (e) { mxw = null; }
    if (!mxw) {
      for (const svc of await server.getPrimaryServices()) {
        for (const ch of await svc.getCharacteristics()) {
          if (ch.properties.writeWithoutResponse || ch.properties.write) { characteristic = ch; break; }
        }
        if (characteristic) break;
      }
    }
    if (!characteristic) throw new Error('No writable characteristic found on this device.');
    $('printBtn').disabled = false;
    $('connectBtn').textContent = 'Connected: ' + (device.name || 'printer');
    const p = mxw ? mxw.dat.properties : null;
    status('Connected. Ready to print.' + (p ? ' (data channel: ' + (p.write ? 'write ' : '') + (p.writeWithoutResponse ? 'writeWithoutResponse' : '') + ')' : ''), 'ok');
  } catch (e) {
    status('Connect failed: ' + e.message, 'err');
  }
}

// ---------- MXW01 protocol ----------
const UUID = s => `0000${s}-0000-1000-8000-00805f9b34fb`;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const inbox = {};
const seen = [];
const hex = d => Array.from(d, b => b.toString(16).padStart(2, '0')).join(' ');
const t0log = Date.now();
const log = m => {
  const el = $('log');
  if (el) el.textContent += ((Date.now() - t0log) / 1000).toFixed(1) + 's ' + m + '\n';
};
$('copyLog').addEventListener('click', () => {
  try { navigator.clipboard.writeText($('log').textContent); status('Log copied.'); }
  catch (e) { status('Could not copy – select the log text manually.', 'err'); }
});
const propStr = p => ['read', 'write', 'writeWithoutResponse', 'notify', 'indicate'].filter(k => p[k]).join('+');

function crc8(bytes) {            // CRC-8, polynomial 0x07
  let crc = 0;
  for (const b of bytes) {
    crc ^= b;
    for (let i = 0; i < 8; i++) crc = (crc & 0x80) ? ((crc << 1) ^ 0x07) & 0xFF : (crc << 1) & 0xFF;
  }
  return crc;
}
function makeCmd(id, payload) {
  const p = Uint8Array.from(payload);
  return Uint8Array.from([0x22, 0x21, id, 0x00, p.length & 255, p.length >> 8, ...p, crc8(p), 0xFF]);
}
function onNotify(e) {
  const v = e.target.value;
  const d = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
  seen.push(String(e.target.uuid).slice(4, 8) + ': ' + hex(d));
  log('notify ' + seen[seen.length - 1]);
  if (seen.length > 20) seen.shift();
  if (d.length < 6 || d[0] !== 0x22 || d[1] !== 0x21) return;
  (inbox[d[2]] = inbox[d[2]] || []).push(d.slice());
}
function waitFor(cmd, ms) {
  return new Promise((res, rej) => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      const q = inbox[cmd];
      if (q && q.length) { clearInterval(iv); res(q.shift()); }
      else if (Date.now() - t0 > ms) { clearInterval(iv); rej(new Error('Printer did not respond (command 0x' + cmd.toString(16) + ')')); }
    }, 50);
  });
}
async function sendCmd(id, payload) {
  await mxw.ctl.writeValueWithoutResponse(makeCmd(id, payload));
}

async function printMxw01(bmp) {
  for (const k in inbox) delete inbox[k];

  await sendCmd(0xA1, [0x00]);                        // status
  const st = await waitFor(0xA1, 10000);
  if (st.length >= 14 && st[12] !== 0) {
    const errs = { 1: 'no paper', 9: 'no paper', 4: 'overheated', 8: 'low battery' };
    throw new Error('Printer reported: ' + (errs[st[13]] || 'error code ' + st[13]));
  }

  await sendCmd(0xA2, [parseInt($('darkness').value, 10)]);   // intensity 0-100

  // pad to at least 90 rows (printer ignores very short jobs)
  let rows = bmp.H;
  const MIN_ROWS = 90;
  const data = rows >= MIN_ROWS ? bmp.data : (() => {
    const d = new Uint8Array(MIN_ROWS * bmp.bpr); d.set(bmp.data); rows = MIN_ROWS; return d;
  })();

  await sendCmd(0xA9, [rows & 255, rows >> 8, 0x30, 0x00]);   // print request (monochrome)
  const ack = await waitFor(0xA9, 10000);
  if (ack.length > 6 && ack[6] !== 0) throw new Error('Printer rejected the print request');

  const mode = 'adaptive';
  const useResp = false;   // this printer's data channel only reliably accepts unacknowledged writes
  // Start with big packets (fewest BLE calls) and adapt: back off if the bridge rate-limits us,
  // step the packet size down only if a write is rejected for size.
  const SIZES = [200, 100, 60, 20];
  // Tunable from the page address, e.g. ...index.html?chunk=100&delay=120
  const qs = new URLSearchParams(location.search);
  let chunk = Math.min(200, Math.max(20, parseInt(qs.get('chunk'), 10) || SIZES[0]));
  let delay = Math.max(0, parseInt(qs.get('delay'), 10) || 70);
  let rateHits = 0;
  log(`data: ${data.length} bytes, ${rows} rows, mode=${mode}, acknowledged=${useResp}, chunk=${chunk}, delay=${delay}ms`);
  let writes = 0;
  const tStart = Date.now();
  for (let i = 0; i < data.length; ) {
    const slice = data.slice(i, i + chunk);
    try {
      if (useResp) {
        if (mxw.dat.writeValueWithResponse) await mxw.dat.writeValueWithResponse(slice);
        else await mxw.dat.writeValue(slice);
      } else {
        await mxw.dat.writeValueWithoutResponse(slice);
      }
      i += chunk; writes++;
    } catch (e) {
      const em = (e && e.message) ? e.message : String(e);
      log('write error at byte ' + i + ' (chunk ' + chunk + ', delay ' + delay + 'ms): ' + em);
      if (/rate limit|too many/i.test(em)) {            // bridge is throttling us: slow down and retry same packet
        if (++rateHits > 60) throw new Error('The Bluetooth bridge keeps rate-limiting the transfer (' + em + ')');
        delay = Math.min(400, delay * 2);
        await sleep(300 + delay);
        continue;
      }
      const next = SIZES.find(s => s < chunk);          // otherwise try a smaller packet size
      if (next) { chunk = next; await sleep(50); continue; }
      throw e;
    }
    if (delay) await sleep(delay);
    if (writes % 40 === 0) log(`sent ${i} bytes (${writes} writes) in ${((Date.now() - tStart) / 1000).toFixed(1)}s`);
    if (writes % 10 === 0) status(`Sending data… ${Math.min(100, Math.round(i * 100 / data.length))}%`);
  }

  const secs = (Date.now() - tStart) / 1000;
  log('data finished: ' + writes + ' writes, final chunk size ' + chunk + ', ' + secs.toFixed(1) + 's, ~' + Math.round(data.length / secs) + ' bytes/s');
  // Some Bluetooth bridges report a write as done before it has actually been sent. Give the last
  // packets time to reach the printer before telling it the data is finished, or the bottom is lost.
  status('Finishing…');
  await sleep(2500);
  await sendCmd(0xAD, [0x00]);                        // flush
  log('flush sent');
  try {                                               // print complete (not all units send this)
    await waitFor(0xAA, 10000 + (rows / 30) * 1000);
    return true;
  } catch (e) {
    return false;
  }
}

async function print() {
  if (!characteristic) return;
  $('printBtn').disabled = true;
  try {
    render();
    const copies = Math.max(1, Math.min(20, parseInt($('copies').value, 10) || 1));
    if (mxw) {
      let confirmed = true;
      for (let c = 0; c < copies; c++) {
        status(`Printing ${c + 1} of ${copies}…`);
        if (!(await printMxw01(toBitmap(true)))) confirmed = false;
      }
      if (confirmed) status('Done!', 'ok');
      else status('Data sent, but the printer sent no "finished" message. Printer replies: ' + (seen.slice(-6).join(' | ') || 'none'));
      return;
    }
    const payload = buildEscPos(toBitmap());
    const chunk = 100;
    for (let c = 0; c < copies; c++) {
      status(`Printing ${c + 1} of ${copies}…`);
      for (let i = 0; i < payload.length; i += chunk) {
        const slice = payload.subarray(i, i + chunk);
        if (characteristic.properties.writeWithoutResponse && characteristic.writeValueWithoutResponse)
          await characteristic.writeValueWithoutResponse(slice);
        else
          await characteristic.writeValue(slice);
        await new Promise(r => setTimeout(r, 15));
      }
    }
    status('Done!', 'ok');
  } catch (e) {
    const msg = (e && e.message) ? e.message : (e && e.name) ? e.name : String(e);
    log('ERROR: ' + msg);
    status('Print failed: ' + msg, 'err');
  } finally {
    $('printBtn').disabled = !characteristic;
  }
}
function btHint() {
  if (navigator.bluetooth) return '';
  if (!window.isSecureContext) return 'No Web Bluetooth: this page is not on https (it is on ' + location.protocol + '). Host it at an https address.';
  return 'No Web Bluetooth: Safari is not getting it from the extension. Turn the extension on, allow it on this site, open the page in a normal (not Private) tab, then reload.';
}
status(navigator.bluetooth ? 'Page ready.' : btHint(), navigator.bluetooth ? '' : 'err');
})();
</script>
